[project]
name = "talonbox"
version = "0.2.1"
description = "A local sandbox for testing Talon scripts. Inspired by playwright-cli."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "James Stout"}]
requires-python = ">=3.11"
dependencies = [
    "click",
    "vncdotool>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/wolfmanstout/talonbox"
Changelog = "https://github.com/wolfmanstout/talonbox/releases"
Issues = "https://github.com/wolfmanstout/talonbox/issues"
CI = "https://github.com/wolfmanstout/talonbox/actions"

[project.scripts]
talonbox = "talonbox.cli:cli"

[dependency-groups]
dev = [
    "basedpyright==1.39.3",
    "pytest",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
